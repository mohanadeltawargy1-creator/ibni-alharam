<style>
:root{color-scheme:dark;--night:#14213D;--gold:#F2C14E;--tq:#2EC4B6;--sand:#F6E7C1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--night);color:var(--sand);font-family:"Reem Kufi",Tahoma,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%;max-width:520px;margin:0 auto}
canvas{width:100%;height:100%;display:block}
#hud{position:absolute;top:14px;inset-inline:0;text-align:center;font-size:64px;font-weight:700;color:var(--gold);pointer-events:none;line-height:1}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;gap:10px;text-align:center;padding:16px;background:rgba(20,33,61,.74)}
@media (max-height:720px){h1{font-size:36px}p{font-size:16px}button{font-size:20px;padding:9px 0}button.s{font-size:17px;padding:7px 0}.dc{font-size:15px;padding:7px 12px}}
#ov.hide{display:none}
#ov>*{animation:pop .28s ease both}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
@media (prefers-reduced-motion:reduce){#ov>*{animation:none}}
#pw{position:absolute;bottom:14px;inset-inline:0;display:none;justify-content:center;gap:10px;z-index:2}
#pw button{width:auto;font-size:15px;padding:8px 14px;background:rgba(20,33,61,.7);color:var(--sand);border:1px solid var(--sand)}
#pw button:disabled{opacity:.4}
h1{margin:0;font-size:46px;color:var(--gold);line-height:1.2}
p{margin:0;font-size:19px;max-width:18em;line-height:1.5}
.dc{font-size:17px;background:rgba(242,193,78,.14);border:1px solid var(--gold);border-radius:12px;padding:10px 16px;line-height:1.6;max-width:19em}
.best{font-size:18px;opacity:.85}
button{font:inherit;font-size:24px;font-weight:700;color:var(--night);background:var(--gold);border:0;border-radius:14px;padding:12px 0;width:min(78%,300px);cursor:pointer}
button.s{background:transparent;color:var(--sand);border:2px solid var(--sand);font-size:19px;padding:9px 0}
button.ad{background:var(--tq)}
.row{display:flex;gap:8px;width:min(78%,300px)}
.row button{width:auto;flex:1;font-size:18px;padding:8px 0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:min(94%,380px)}
.grid button{width:auto;min-width:0;overflow-wrap:anywhere;font-size:14px;line-height:1.35;padding:10px 2px}
button:focus-visible{outline:3px solid var(--sand);outline-offset:3px}
button{background:linear-gradient(180deg,#FFD97A,#E5A93A);box-shadow:0 4px 0 #A9741B,0 8px 18px rgba(0,0,0,.28);transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #A9741B}
button.s{background:rgba(246,231,193,.09);box-shadow:none;border:1.5px solid rgba(246,231,193,.5)}
button.ad{background:linear-gradient(180deg,#5EE0D2,#22A99B);box-shadow:0 4px 0 #17776D,0 8px 18px rgba(0,0,0,.28)}
#pw button{box-shadow:none;background:rgba(20,33,61,.65)}
#ov{background:radial-gradient(circle at 50% 35%,rgba(58,79,143,.55),rgba(14,22,48,.9));backdrop-filter:blur(3px)}
.dc,.best{background:rgba(246,231,193,.1);border:1px solid rgba(246,231,193,.3)}
.best{padding:6px 14px;border-radius:999px}
.grid button svg{display:block;margin:0 auto 4px;color:var(--gold)}
.co{width:1em;height:1em;vertical-align:-.15em}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-inline-end:3px;vertical-align:middle}
h1{text-shadow:0 2px 14px rgba(242,193,78,.45)}
#pz{position:absolute;top:16px;inset-inline-start:14px;display:none;width:40px;height:40px;padding:0;border-radius:50%;font-size:13px;z-index:2;color:var(--night)}
.fl{font-size:16px;opacity:.85;font-weight:600}
</style>
</head>
<body>
<div id="app"><canvas id="c"></canvas><div id="hud">0</div><button id="pz" aria-label="pause">❚❚</button><div id="pw"></div><div id="ov"></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hud=document.getElementById('hud'),ov=document.getElementById('ov');
let S=1,H=640;
function fit(){const d=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();cv.width=r.width*d;cv.height=r.height*d;S=cv.width/360;H=cv.height/S}
addEventListener('resize',fit);fit();
const BH=26;
let blocks,cur,dir,speed,state='menu',score=0,best=0,cam=0,pieces=[],parts=[],combo=0,flash=0,perf=0,contUsed=false,mute=false;
const stars=Array.from({length:45},()=>({x:Math.random()*360,y:Math.random()*520,r:Math.random()*1.4+.4}));
try{best=+localStorage.getItem('pyr_best')||0;mute=localStorage.getItem('pyr_mute')==='1'}catch(e){}
const SK=[{n:'ذهبي كلاسيك',p:0,f:n=>`hsl(${(38+n*9)%360},62%,${58-(n%2)*4}%)`},{n:'فرعوني',p:100,f:n=>n%2?'#2EC4B6':'#F2C14E'},{n:'نيون',p:250,f:n=>`hsl(${(n*25+170)%360},95%,60%)`},{n:'رخام',p:400,f:n=>n%2?'#E8E6E1':'#BFC5CC'},{n:'ملكي (أسبوعي)',p:-1,f:n=>n%2?'#D4AF37':'#7B2CBF'},
{n:'رملي',p:150,f:n=>`hsl(${38+(n%3)*4},${45+(n%2)*8}%,${62-(n%3)*4}%)`},
{n:'لازورد',p:200,f:n=>`hsl(${215+(n*6)%30},65%,${40+(n%2)*10}%)`},
{n:'غروب',p:250,f:n=>`hsl(${(350+n*6)%360},80%,${55+(n%2)*5}%)`},
{n:'زمرد',p:300,f:n=>`hsl(${150+(n*4)%30},60%,${38+(n%2)*10}%)`},
{n:'ياقوت',p:350,f:n=>`hsl(${345+(n%3)*5},70%,${40+(n%2)*10}%)`},
{n:'جليد',p:400,f:n=>`hsl(${190+(n*3)%25},70%,${72+(n%2)*8}%)`},
{n:'حمم',p:450,f:n=>n%2?'#E4572E':'#3B1F1A'},
{n:'ليل',p:500,f:n=>`hsl(${250+(n*5)%40},45%,${28+(n%2)*10}%)`},
{n:'قوس قزح',p:700,f:n=>`hsl(${(n*28)%360},80%,60%)`},
{n:'ذهب أسود',p:900,f:n=>n%2?'#222':'#D4AF37'}];
const TH=[['#4FA3E0','#8FCBEF','#F6E7C1'],['#14213D','#3A4F8F','#E9A25B'],['#2A1646','#6B2E6F','#E86A5A'],['#050A1E','#14213D','#2B3F7A']];
let coins=0,own=[0],skin=0,rw={last:'',streak:0},paid=0,msg='',bgf=0,ach={},music=true,mc=0,gc=0,wk='',lang=(navigator.language||'ar').startsWith('ar')?'ar':'en',shield=0,slowT=0,adc={d:'',n:0},buyPending=null,packOwned=false,maxDay='',xpPaid=0,adTok=0,adBusy=false,runId=0,bc=0,curDay='',seen=false,xp=0,ac=true,shake=0,gh=false,timeLeft=60,mode='endless',bests={},mt=null;
const rd=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const isN=v=>typeof v==='number'&&isFinite(v)&&v>=0;
{const m=rd('pyr_meta'),M=m&&typeof m==='object'&&!Array.isArray(m)?m:{};
if(isN(M.coins))coins=Math.floor(M.coins);
if(Array.isArray(M.own)){own=[...new Set(M.own.filter(i=>Number.isInteger(i)&&i>=0&&i<SK.length))];if(!own.includes(0))own.unshift(0)}
if(own.includes(M.skin))skin=M.skin;
if(M.rw&&typeof M.rw.last==='string'&&isN(M.rw.streak))rw={last:M.rw.last,streak:Math.floor(M.rw.streak)};
if(M.ach&&typeof M.ach==='object'&&!Array.isArray(M.ach))ach=M.ach;
if(typeof M.wk==='string')wk=M.wk;
seen=M.seen===true;if(isN(M.xp))xp=Math.floor(M.xp);ac=M.ac!==false;
if(M.lang==='ar'||M.lang==='en')lang=M.lang;music=M.music!==false;
if(typeof M.md==='string')maxDay=M.md;if(M.adc&&typeof M.adc.d==='string'&&isN(M.adc.n))adc={d:M.adc.d,n:Math.floor(M.adc.n)};packOwned=M.pk===true}
{const b=rd('pyr_bests');if(b&&typeof b==='object'&&!Array.isArray(b))for(const k of['endless','time','hard'])if(isN(b[k]))bests[k]=Math.floor(b[k]);best=bests.endless||best}
function sv(){try{localStorage.setItem('pyr_meta',JSON.stringify({coins,own,skin,rw,ach,music,wk,seen,xp,ac,lang,md:maxDay,adc,pk:packOwned}))}catch(e){}}
const col=n=>SK[skin].f(n);


const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const MD={endless:'♾ بلا نهاية',time:'⏱ ضد الساعة (60 ثانية)',hard:'💀 صعب'};
const AL=[['h25','طابق 25'],['h50','طابق 50'],['c5','5 ضربات ظبط ورا بعض'],['c10','10 ضربات ظبط ورا بعض'],['g1','أول حجر دهبي'],['dc','خلصت التحدي اليومي']];
function achs(){scr('<h1>الإنجازات</h1>'+AL.map(a=>`<div class="dc">${ach[a[0]]?'✅':'🔒'} ${a[1]}</div>`).join('')+'<button class="s" data-act="menu">رجوع</button>')}
function spin(first){if(first&&rw.last===today())return wheelDone();if(first){rw.streak=rw.last===yday()?rw.streak+1:1;rw.last=today()}const P=[10,10,20,20,30,50,100],a=P[Math.floor(Math.random()*P.length)]+Math.min(rw.streak,6)*5;coins+=a;sv();sfx.win();scr(`<h1>🎡 كسبت ${a} 🪙</h1><p>${first?'ارجع بكرة عشان تلف تاني':''}</p>${adsAvailable()?'<button class="ad" data-act="spinad">▶ لفة تانية بإعلان</button>':''}<button data-act="menu">تمام</button>`)}
const STORE_URL='';// set to the Google Play URL after publishing: https://play.google.com/store/apps/details?id=PACKAGE
function shareLink(){if(STORE_URL)return STORE_URL;try{if(location.protocol==='https:'||location.protocol==='http:')return location.href}catch(e){}return ''}
function share(){const lk=shareLink();let t='وصلت طابق '+(blocks.length-1)+' في لعبة ابني الهرم! اتحداني 🔺'+(lk?' '+lk:'');t=tr(t);cv.toBlob(bl=>{try{const f=new File([bl],'pyramid.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],text:t}).catch(()=>{});return}}catch(e){}try{if(navigator.share){navigator.share({text:t}).catch(()=>{});return}}catch(e){}open('https://wa.me/?text='+encodeURIComponent(t))})}
function mus(){clearInterval(mt);if(!music)return;const P=[262,294,330,392,440,523];let k=2,c=0;mt=setInterval(()=>{if(state!=='play')return;k=Math.max(0,Math.min(5,k+[-1,0,1][Math.floor(Math.random()*3)]));tone(P[k],1.6,'sine',.035);if(c++%4===0)tone(131,2.6,'sine',.03)},1100)}

function wkHtml(){return wk===String(wid)?'✅ خلصت تحدي الأسبوع (سكن ملكي)':'📅 تحدي الأسبوع: ابني '+W.floors+' طابق واجمع '+W.gold+' أحجار دهبية في دور واحد.<br>الجايزة: سكن ملكي + 100 🪙'}
function chs(){scr(`<h1>التحديات</h1><div class="dc">${dcHtml()}</div><div class="dc">${wkHtml()}</div><p>التحديات بتمشي في وضع "بلا نهاية" بس.</p><button class="s" data-act="menu">رجوع</button>`)}
function wheelDone(){scr('<h1>🎡 خلصت لفتك النهاردة</h1>'+(adsAvailable()?'<p>ارجع بكرة، أو لف تاني بإعلان.</p><button class="ad" data-act="spinad">▶ لفة بإعلان</button>':'<p>ارجع بكرة.</p>')+'<button class="s" data-act="menu">رجوع</button>')}
const pw=document.getElementById('pw');
function upPw(){pw.innerHTML=`<button data-p="slow" ${coins<15?'disabled':''}>🐢 إبطاء · 15🪙</button><button data-p="shield" ${coins<25||shield?'disabled':''}>🛡 ${shield?'جاهزة':'فرصة · 25🪙'}</button>`}
pw.addEventListener('pointerdown',e=>{e.stopPropagation();const b=e.target.closest('button');if(!b||state!=='play')return;if(b.dataset.p==='slow'&&coins>=15){coins-=15;slowT=5;sv();tone(300,.15,'sine',.2)}else if(b.dataset.p==='shield'&&!shield&&coins>=25){coins-=25;shield=1;sv();tone(500,.15,'sine',.2)}upPw()});
const RK=[[0,'عامل بناء'],[100,'مهندس'],[300,'كبير البنائين'],[700,'مهندس الفرعون'],[1500,'حارس الأهرام']];
function rankOf(){let r=RK[0][1];for(const k of RK)if(xp>=k[0])r=k[1];return r}
const TT=[['اضغط في الوقت المظبوط','الحجر بيتحرك يمين وشمال. اضغط عشان ينزل فوق اللي تحته.'],['الظبط بيكبّر الحجر','اللي بيطلع برا بيتقطع. النزلة المظبوطة بتوسّع الحجر وبتديك عملات.'],['أحجار مميزة ومساعدات','الدهبي 3 نقاط، والأحمر أسرع. بالعملات تشتري إبطاء أو فرصة تانية من الأزرار تحت.']];
function tut(n){if(n>2){seen=true;sv();play();return}scr(`<h1>${TT[n][0]}</h1><p>${TT[n][1]}</p><button data-act="tut" data-n="${n+1}">${n<2?'التالي':'ابدأ'}</button>`)}
function buy(id){if(!buyAvailable()){shop();return}if(id==='pack'?packOwned:!BN.some(b=>b[0]===id))return;buyPending=id;try{Android.purchase(id)}catch(e){buyPending=null}}
window.__granted=function(id){if(!id||buyPending!==id)return;buyPending=null;if(id==='pack'){if(packOwned)return;packOwned=true;coins+=300;[1,2].forEach(i=>own.includes(i)||own.push(i))}else{const b=BN.find(x=>x[0]===id);if(!b)return;coins+=b[1]}sv();shop()};
const BN=[['c150',150],['c500',500],['c1200',1200],['c3000',3000]];
function shop(){
 if(!buyAvailable()){scr('<h1>🛒 المتجر</h1><p>المشتريات داخل التطبيق مش مفعّلة في النسخة دي. هتتفعّل داخل تطبيق أندرويد.</p><button class="s" data-act="menu">رجوع</button>');return}
 const pr=id=>{const v=window.__prices&&window.__prices[id];return v?' · '+String(v).replace(/[<>&"'`]/g,''):''};
 scr('<h1>🛒 المتجر</h1>'+(packOwned?'':`<button data-act="b_pack">🎁 باقة البداية — 300 🪙 + سكنين${pr('pack')}</button>`)+BN.map(b=>`<button class="s" data-act="b_${b[0]}">🪙 ${b[1]}${pr(b[0])}${b[0]==='c3000'?' ⭐ الأوفر':''}</button>`).join('')+(adsAvailable()?'<button class="ad" data-act="coinad">▶ +30 🪙 بإعلان</button>':'')+'<button class="s" data-act="menu">رجوع</button>')}

  if(state!=='play')return;

  else if(act==='wipe2'){try{['pyr_meta','pyr_bests','pyr_daily','pyr_best','pyr_mute'].forEach(k=>localStorage.removeItem(k))}catch(x){}location.reload()}
  else if(act==='spinad'){if(!adCapOk())return scr(CAPMSG);showRewardedAd(()=>{adCount();spin(false)})}
  else if(act==='mode'){bests[mode]=best;mode=mode==='endless'?'time':mode==='time'?'hard':'endless';best=bests[mode]||0;menu()}
  else if(act==='achs')achs();
  else if(act==='mus'){music=!music;sv();mus();menu()}
  else if(act==='share')share();
  else if(act==='coinad'){if(!adCapOk())return scr(CAPMSG);showRewardedAd(()=>{adCount();coins+=30;sv();skins()})}
  else if(act&&act.startsWith('sk'))pick(+act.slice(2));
  else if(act==='cont'){if(contUsed||state!=='over'||adBusy)return;adBusy=true;const run=runId,tok=++adTok;showRewardedAd(()=>{if(tok!==adTok||run!==runId||state!=='over'||contUsed){adBusy=false;return}adBusy=false;contUsed=true;spawn();state='play';ov.classList.add('hide')})}
});
cv.addEventListener('pointerdown',drop);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state==='play')drop();else if(state==='menu'||state==='over')play()}});
applyLang();menu();
let last=performance.now();
function loop(t){
  const dt=Math.min((t-last)/16.67,3);last=t;
  if(state==='play'){
    cur.x+=dir*speed*dt*(slowT>0?.5:1);slowT=Math.max(0,slowT-dt/60);if(blocks.length>30)cur.x+=Math.sin(performance.now()/700)*.7*dt;if(mode==='time'){timeLeft-=dt/60;if(timeLeft<=0){timeLeft=0;end()}}
    if(cur.x<-cur.w/2){cur.x=-cur.w/2;dir=1}
    if(cur.x>360-cur.w/2){cur.x=360-cur.w/2;dir=-1}
  }
  const camT=Math.max(0,blocks.length-5)*BH;cam+=(camT-cam)*.08*dt;
  pieces.forEach(p=>{p.vy+=.5*dt;p.py+=p.vy*dt});
  pieces=pieces.filter(p=>p.py<H+200);
  parts.forEach(p=>{p.x+=p.vx*dt;p.py+=p.vy*dt;p.vy+=.3*dt;p.l-=.025*dt});
  parts=parts.filter(p=>p.l>0);
  flash=Math.max(0,flash-.03*dt);bgf=Math.max(0,bgf-.03*dt);
  hud.style.visibility=state==='play'?'visible':'hidden';pw.style.display=state==='play'?'flex':'none';pz.style.display=state==='play'?'block':'none';shake=Math.max(0,shake-.6*dt);
  draw();requestAnimationFrame(loop);
}
function draw(){
  ctx.setTransform(S,0,0,S,(Math.random()-.5)*shake*S,(Math.random()-.5)*shake*S);
  const ph=Math.floor(blocks.length/10)%4,T=TH[ph],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,T[0]);g.addColorStop(.7,T[1]);g.addColorStop(1,T[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,360,H);
  ctx.fillStyle='#F6E7C1';
  stars.forEach(s=>{const y=s.y+cam*.1;if(y<H*.6){ctx.globalAlpha=[0,.2,.6,.9][ph];ctx.fillRect(s.x,y,s.r,s.r)}});ctx.globalAlpha=1;
  const sg=ctx.createRadialGradient(290,110+cam*.1,10,290,110+cam*.1,130);sg.addColorStop(0,'rgba(255,230,160,.45)');sg.addColorStop(1,'rgba(255,230,160,0)');ctx.fillStyle=sg;ctx.fillRect(130,0,230,300+cam*.1);ctx.fillStyle=['#FFF3B0','#F6E7C1','#F9A875','#E8EEF9'][ph];ctx.beginPath();ctx.arc(290,110+cam*.1,32,0,7);ctx.fill();
  const base=H-90+cam,gy=base+BH;
  ctx.fillStyle='#8A6A3E';
  [[20,150,75],[210,120,55],[300,90,40]].forEach(([x,w,h])=>{ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+w/2,gy-h);ctx.lineTo(x+w,gy);ctx.fill()});
  ctx.fillStyle='#C9944F';ctx.fillRect(0,gy,360,H);
  const yOf=i=>base-i*BH;
  blocks.forEach((b,i)=>{ctx.fillStyle=b.t==='g'?'#FFD23F':col(i);ctx.fillRect(b.x,yOf(i),b.w,BH-2);shade(b.x,yOf(i),b.w);if(i&&i%10===0){const y=yOf(i),x=b.x+b.w-8;ctx.fillStyle='#F6E7C1';ctx.fillRect(x,y-22,2,22);ctx.fillStyle='#E4572E';ctx.beginPath();ctx.moveTo(x+2,y-22);ctx.lineTo(x+16,y-16);ctx.lineTo(x+2,y-10);ctx.fill()}});
  if(state==='play'){ctx.fillStyle=cur.t==='g'?'#FFD23F':cur.t==='f'?'#E4572E':col(blocks.length);ctx.fillRect(cur.x,yOf(blocks.length),cur.w,BH-2);shade(cur.x,yOf(blocks.length),cur.w)}
  pieces.forEach(p=>{ctx.fillStyle=p.c;ctx.fillRect(p.x,yOf(p.lvl)+p.py,p.w,BH-2)});
  ctx.fillStyle='#F2C14E';parts.forEach(p=>{ctx.globalAlpha=p.l;ctx.fillRect(p.x,yOf(p.lvl)+p.py,4,4)});ctx.globalAlpha=1;
  const vg=ctx.createRadialGradient(180,H*.5,H*.35,180,H*.5,H*.85);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(10,15,40,.35)');ctx.fillStyle=vg;ctx.fillRect(0,0,360,H);
  if(state==='play'){if(mode==='time'){ctx.fillStyle='#2EC4B6';ctx.fillRect(0,0,360*timeLeft/60,5)}if(blocks.length>30){ctx.fillStyle='#F6E7C1';ctx.font='20px sans-serif';ctx.textAlign='left';ctx.fillText('💨',12,36)}}
  if(bgf>0){ctx.globalAlpha=bgf;ctx.fillStyle='#fff';ctx.fillRect(0,0,360,H);ctx.globalAlpha=1}
  if(flash>0){ctx.globalAlpha=Math.min(flash,1);ctx.fillStyle='#2EC4B6';ctx.font='700 30px "Reem Kufi",Tahoma';ctx.textAlign='center';ctx.fillText(tr(msg),180,150);ctx.globalAlpha=1}
}
requestAnimationFrame(loop);
</script>
